    <link rel="canonical" href="https://qitaat.com/" />

    <!-- Google Search Console verification -->

    <!-- Favicon & PWA Icons -->

    <link rel="icon" href="/pwa-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />

    <link rel="alternate" hreflang="en" href="https://qitaat.com" />
    <link rel="alternate" hreflang="x-default" href="https://qitaat.com" />

    <!-- Sitemap Discovery -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml">

    <link rel="dns-prefetch" href="https://hckpxwhjycmdflaneihd.supabase.co" />
    <link rel="preconnect" href="https://hckpxwhjycmdflaneihd.supabase.co" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
     <link rel="preload" as="style" crossorigin href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" fetchpriority="high" />
     <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" /></noscript>
    <!-- LCP image preload: only on the home route. External script so CSP
         can avoid 'unsafe-eval' and tighten 'script-src'. -->
    <script src="/preload-hero.js"></script>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="dns-prefetch" href="https://unpkg.com" />

    <!-- Security -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- Geolocation API is not used in the app; deny it entirely. -->
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), interest-cohort=(), browsing-topics=()" />
    <!-- X-Frame-Options can only be set via HTTP header; browsers reject the meta form.
         Use frame-ancestors in the CSP below instead. -->

    <!--
      Content-Security-Policy — ENFORCED.
      Notes:
        - 'unsafe-eval' removed (no longer needed; bootstrap script externalized).
        - 'unsafe-inline' kept on script-src for inline JSON-LD blocks and the
          font preload onload handler. Future: replace with hashes to drop it.
        - 'unsafe-inline' on style-src is required by Tailwind/Vite/Radix injected styles.
        - connect-src covers Supabase REST + Realtime (wss) + Google Fonts.
        - frame-ancestors lets the Lovable preview embed the app.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      base-uri 'self';
      form-action 'self';
      object-src 'none';
      frame-ancestors 'self' https://*.lovable.app https://*.lovable.dev https://lovable.dev;
      script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com;
      script-src-attr 'unsafe-inline';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' data: https://fonts.gstatic.com;
      img-src 'self' data: blob: https:;
      media-src 'self' data: blob: https:;
      connect-src 'self' https://hckpxwhjycmdflaneihd.supabase.co wss://hckpxwhjycmdflaneihd.supabase.co https://*.supabase.co wss://*.supabase.co https://fonts.googleapis.com https://fonts.gstatic.com https://www.googletagmanager.com;
      worker-src 'self' blob:;
      manifest-src 'self';
      upgrade-insecure-requests
    " />

    <!-- AI crawler discovery -->
    <link rel="alternate" type="text/plain" title="LLM crawler manifest" href="/llms.txt" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "قِطاعات Qitaat",
      "url": "https://qitaat.com",

      "potentialAction": {

          "@type": "EntryPoint",

        },
        "query-input": "required name=search_term_string"
      },
      "publisher": {
        "@type": "Organization",

        }
      }
    }
