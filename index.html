    <!--
      Content-Security-Policy — ENFORCED.
      Notes:
        - 'unsafe-eval' removed (no longer needed; bootstrap script externalized).
        - 'unsafe-inline' kept on script-src for inline JSON-LD blocks and the
          font preload onload handler. Future: replace with hashes to drop it.
        - 'unsafe-inline' on style-src is required by Tailwind/Vite/Radix injected styles.
        - connect-src covers Supabase REST + Realtime (wss) + Google Fonts.
        - frame-ancestors is INTENTIONALLY OMITTED here: browsers ignore
          frame-ancestors when delivered via <meta> and emit a console
          warning. It must be set as an HTTP response header by hosting
          (Lovable) instead. Fallback embedding protection is still
          provided by `object-src 'none'` and the lack of legacy plugins.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      base-uri 'self';
      form-action 'self';

    <!-- Google Consent Mode v2 defaults + GTM container.
         VITE_GTM_ID is substituted at build time. The runtime bootstrap in
         src/lib/gtm.ts is a no-op when GTM is already present in HTML. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'granted',
        security_storage: 'granted',
        wait_for_update: 500
      });
      // Replay any previously persisted consent decision BEFORE GTM loads.
      // Without this, returning visitors who already accepted are reported to
      // GTM as "denied" forever — the banner never re-opens, so no consent
      // update is ever pushed. This is what causes "0% consent rate" in
      // GTM Container Quality. Schema kept in sync with src/lib/gtm.ts.
      try {
        var __qc = localStorage.getItem('qitaat_consent_v1');
        if (__qc) {
          var __p = JSON.parse(__qc);
          if (__p && __p.state) {
            gtag('consent', 'update', __p.state);
            window.dataLayer.push({
              event: 'consent_update',
              consent_decision: __p.decision,
              consent_replay: true
            });
          }
        }
      } catch (e) { /* storage unavailable */ }
    </script>
    <!-- Google Tag Manager — production-host gated AND idle-deferred.
         Consent Mode v2 defaults are pushed synchronously above, BEFORE
         gtm.js loads (Google's required order). The container loader
         itself waits for window 'load' + requestIdleCallback so it never
         competes with the LCP paint. Preview override unchanged:
         localStorage.setItem('qitaat_enable_analytics_preview','1'). -->
    <script>(function(w,d,s,l,i){
      try {
        var h = w.location && w.location.hostname || '';
        var prod = (h === 'qitaat.com' || h === 'www.qitaat.com');
        var override = false;
        try { override = w.localStorage && w.localStorage.getItem('qitaat_enable_analytics_preview') === '1'; } catch(e) {}
        if (!prod && !override) return;
      } catch(e) { return; }
      function loadGtm(){
        if (d.getElementById('gtm-loader-html')) return;
        w[l]=w[l]||[];w[l].push({'gtm.start': new Date().getTime(),event:'gtm.js'});
        var f=d.getElementsByTagName(s)[0],
            j=d.createElement(s),
            dl=l!='dataLayer'?'&l='+l:'';
        j.id='gtm-loader-html';j.async=true;
        j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;
        f.parentNode.insertBefore(j,f);
      }
      function schedule(){
        if (typeof w.requestIdleCallback === 'function') {
          w.requestIdleCallback(loadGtm, { timeout: 4000 });
        } else {
          setTimeout(loadGtm, 2500);
        }
      }
      if (d.readyState === 'complete') schedule();
      else w.addEventListener('load', schedule, { once: true });
    })(window,document,'script','dataLayer','%VITE_GTM_ID%');</script>
