name: Code Quality & Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Brand Audit (faneen residue check)
        run: node scripts/brand-audit.mjs

      - name: Broken Internal Links Audit
        run: node scripts/broken-links-audit.mjs

      - name: SEO NoIndex/Canonical Audit
        run: node scripts/seo-noindex-audit.mjs

      - name: Schema.org Structured Data Audit
        run: node scripts/schema-org-audit.mjs

      - name: Page Meta (Title/Description) Audit
        run: node scripts/meta-titles-audit.mjs

      - name: Canonical ↔ Sitemap Audit
        run: node scripts/canonical-sitemap-audit.mjs

      - name: Robots ↔ Sitemap Sync Audit
        run: node scripts/robots-sitemap-sync-audit.mjs

      - name: Sitemap Integrity Audit
        run: node scripts/sitemap-integrity-audit.mjs

      - name: TypeScript Check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: ESLint Check
        run: npx eslint src --ext .ts,.tsx --max-warnings 50
        continue-on-error: true

      - name: Security Audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for secret keys in code
        run: |
          echo "Checking for hardcoded secrets..."

          if grep -r "service_role" src/ --include="*.ts" --include="*.tsx" 2>/dev/null; then
            echo "CRITICAL: service_role key found in source code!"
            exit 1
          else
            echo "OK: No service_role keys in source code"
          fi

          if grep -r "sk-[a-zA-Z0-9]" src/ --include="*.ts" --include="*.tsx" 2>/dev/null; then
            echo "CRITICAL: Possible OpenAI API key found in source code!"
            exit 1
          else
            echo "OK: No OpenAI keys in source code"
          fi

          echo "Secret check passed"

      - name: Bundle Size Check
        run: |
          npm run build
          echo "Build completed successfully"
          du -sh dist/ 2>/dev/null || echo "No dist folder found"

      - name: Sitemap HTTP Audit
        run: node scripts/sitemap-http-audit.mjs --skip-build

      - name: Sitemap Performance Audit
        run: node scripts/sitemap-perf-audit.mjs --threshold 3000
        continue-on-error: true

      - name: Sitemap Live HTTP Audit
        run: node scripts/sitemap-live-http-audit.mjs --base https://qitaat.com --sitemap-url ${{ vars.VITE_SUPABASE_URL && format('{0}/functions/v1/sitemap', vars.VITE_SUPABASE_URL) || 'https://qitaat.com/functions/v1/sitemap' }} --concurrency 10 --timeout 10000
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || '' }}
        continue-on-error: true

      - name: Business & Category Links Audit
        run: node scripts/business-links-audit.mjs --base https://qitaat.com --concurrency 10
        continue-on-error: true
