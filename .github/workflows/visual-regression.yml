name: Visual Regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Playwright visual tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
      options: --ipc=host
    env:
      CI: "true"
      PLAYWRIGHT_BASE_URL: http://localhost:8080
      NODE_OPTIONS: "--max-old-space-size=4096"
      # Browsers ship pre-installed in this image at /ms-playwright; pin so
      # `playwright install` becomes a no-op instead of re-downloading.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Verify package-lock.json sync
        run: |
          echo "Checking package.json ↔ package-lock.json sync..."
          if ! npm ci --dry-run --ignore-scripts > /tmp/npm-ci-dry.log 2>&1; then
            echo "::error::package-lock.json is out of sync with package.json. Run 'npm install' locally and commit the updated package-lock.json."
            tail -n 50 /tmp/npm-ci-dry.log
            exit 1
          fi
          echo "OK: package-lock.json is in sync."

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Ensure Chromium is available
        run: |
          # The Playwright container already ships Chromium + system deps.
          # Skip --with-deps (apt is unneeded and slow inside the image).
          # Only download if the binary is somehow missing.
          if ls "$PLAYWRIGHT_BROWSERS_PATH"/chromium-*/chrome-linux/chrome >/dev/null 2>&1; then
            echo "Chromium already present in $PLAYWRIGHT_BROWSERS_PATH"
          else
            npx playwright install chromium
          fi

      - name: Build app
        run: npm run build

      - name: Start preview server
        run: |
          npx vite preview --host 0.0.0.0 --port 8080 --strictPort \
            > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid

      - name: Wait for server
        run: |
          for i in $(seq 1 120); do
            curl -sf http://localhost:8080 >/dev/null && exit 0
            sleep 1
          done
          echo "::error::Preview server did not become ready in 120s"
          echo "--- preview.log ---"
          cat /tmp/preview.log || true
          exit 1

      - name: Check for visual baselines
        id: baselines
        run: |
          if [ -d "e2e/__screenshots__" ] && [ "$(find e2e/__screenshots__ -name '*.png' | head -1)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No visual baselines found in e2e/__screenshots__/. Skipping visual regression. Seed baselines locally per e2e/VISUAL_REGRESSION.md."
          fi

      - name: Run visual regression tests
        if: steps.baselines.outputs.exists == 'true'
        id: visual
        run: npm run test:visual

      - name: Collect visual diff images (actual / expected / diff)
        if: always() && steps.baselines.outputs.exists == 'true'
        run: |
          mkdir -p visual-diffs
          if [ -d test-results ]; then
            # Playwright writes *-actual.png, *-expected.png, *-diff.png into
            # test-results/<spec>/ on snapshot failure. Flatten them into one
            # folder per failing test so they're easy to scan in the artifact.
            find test-results -type f \( -name "*-actual.png" -o -name "*-expected.png" -o -name "*-diff.png" \) -print0 \
              | while IFS= read -r -d '' f; do
                  rel="${f#test-results/}"
                  dest="visual-diffs/$(dirname "$rel")"
                  mkdir -p "$dest"
                  cp "$f" "$dest/"
                done
          fi
          count=$(find visual-diffs -type f -name "*.png" 2>/dev/null | wc -l)
          echo "Collected $count diff image(s)"
          if [ "$count" -gt 0 ]; then
            {
              echo "## 🖼️ Visual regression failures"
              echo ""
              echo "Found **$count** snapshot diff image(s). Download the \`visual-diffs\` artifact below to inspect actual / expected / diff side-by-side, or open the \`playwright-report\` artifact for the full HTML report."
              echo ""
              echo "<details><summary>Failing snapshots</summary>"
              echo ""
              find visual-diffs -type f -name "*-diff.png" | sort | sed 's|^|- `|; s|$|`|'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload visual diff images
        if: always() && steps.baselines.outputs.exists == 'true' && hashFiles('visual-diffs/**/*.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: visual-diffs/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Playwright HTML report
        if: always() && steps.baselines.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Stop preview server
        if: always()
        run: kill "$(cat /tmp/preview.pid)" 2>/dev/null || true