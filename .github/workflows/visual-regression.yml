name: Visual Regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  visual:
    name: Playwright visual tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy
      options: --ipc=host
    env:
      CI: "true"
      PLAYWRIGHT_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (with system deps)
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Start preview server
        run: |
          npx vite preview --host 0.0.0.0 --port 8080 --strictPort &
          echo $! > /tmp/preview.pid

      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080 >/dev/null && exit 0
            sleep 1
          done
          echo "Server did not become ready"; exit 1

      - name: Check for visual baselines
        id: baselines
        run: |
          if [ -d "e2e/__screenshots__" ] && [ "$(find e2e/__screenshots__ -name '*.png' | head -1)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No visual baselines found in e2e/__screenshots__/. Skipping visual regression. Seed baselines locally per e2e/VISUAL_REGRESSION.md."
          fi

      - name: Run visual regression tests
        if: steps.baselines.outputs.exists == 'true'
        run: npm run test:visual

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Stop preview server
        if: always()
        run: kill "$(cat /tmp/preview.pid)" 2>/dev/null || true